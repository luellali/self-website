name: Publish Luella portfolio once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-portfolio.yml

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download portfolio
        env:
          SITE_BASE: https://luella-portfolio-2026.liluella27.chatgpt.site
        run: |
          mkdir -p site
          while IFS= read -r path; do
            mkdir -p "site/$(dirname "$path")"
            curl --fail --location --retry 4 --retry-delay 3 \
              --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36" \
              "$SITE_BASE/$path" -o "site/$path"
          done <<'PORTFOLIO_FILES'
